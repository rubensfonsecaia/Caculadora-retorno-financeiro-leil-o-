<!doctype html>
<html lang="pt-BR"><body style="margin:0;background:#f8fafc;font-family:Inter,Arial,sans-serif;color:#0f172a">
<div style="max-width:520px;margin:0 auto;padding:32px 20px">
<h1 style="font-size:22px;margin:0 0 16px">Criar uma senha nova</h1>
<p style="font-size:16px;line-height:24px;color:#475569;margin:0 0 24px">Recebemos um pedido para trocar a senha da sua conta. O link vale por 1 hora.</p>
<p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/auth/nova-senha" style="background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px;display:inline-block">Criar senha nova</a></p>
<p style="font-size:14px;line-height:20px;color:#64748b;margin:0">Se não foi você, ignore. Sua senha atual continua valendo.</p>
</div></body></html>
